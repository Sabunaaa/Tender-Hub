<script type="text/javascript">
	$(document).ready(function () {
		$('#refrsh').button({
			icons: {
				primary: "ui-icon-refresh"
			}
		}).click(function () {
			ShowApp(667651, '', 2)
		});
		$('#showtdocs').button({
			icons: {
				primary: "ui-icon-triangle-1-s"
			}
		}).click(function () {
			$.get('library/controller.php', {
				action: 'app_tdocs',
				app_id: 667651
			}, function (data) {
				$('#app_tdocs').html(data);
			});
		})
	});

	function ShowBidHistory(bid, app) {
		var targetelm = 'B' + bid + app;
		var targetcontainer = targetelm + 'C';
		$('#' + targetcontainer).parent().remove();
		$('#' + targetelm).after('<tr><td colspan="5" id="' + targetcontainer + '"></td></tr>');
		$.get('library/controller.php', {
			action: 'view_bid',
			app_id: bid,
			bid_id: app
		}, function (data) {
			$('#' + targetcontainer).html(data);
		});
	}
</script>
